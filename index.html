<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunkWise — Smart Attendance & Bunk Planner</title>
  <meta name="description" content="BunkWise helps college students track attendance, calculate learning-hour percentages, and understand exactly how many classes they can safely skip while staying above their attendance target." />
  <meta name="theme-color" content="#0A0A14" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BunkWise — Smart Attendance & Bunk Planner" />
  <meta property="og:description" content="Precision college attendance & learning hours optimizer for the 75% criteria." />
  <meta property="og:image" content="/upes_bidholi_bg.jpg" />

  <!-- Google Fonts: Sora (Sans), Instrument Serif (Drama), Fira Code (Data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-void text-ghost min-h-screen selection:bg-plasma selection:text-white">
  <!-- Global SVG Noise Overlay (0.05 Opacity to eliminate digital gradients) -->
  <svg class="noise-overlay" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
